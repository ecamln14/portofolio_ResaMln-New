<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1a2530"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#3498db"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bgGrad)"/>

  <!-- subtle grid pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="640" y2="80"/>
    <line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="107" y1="0" x2="107" y2="400"/>
    <line x1="214" y1="0" x2="214" y2="400"/>
    <line x1="321" y1="0" x2="321" y2="400"/>
    <line x1="428" y1="0" x2="428" y2="400"/>
    <line x1="535" y1="0" x2="535" y2="400"/>
  </g>

  <!-- Database icon (stacked cylinders) -->
  <g transform="translate(40,40)" fill="none" stroke="#ecf0f1" stroke-width="3" opacity="0.9">
    <ellipse cx="45" cy="14" rx="45" ry="14" fill="#3498db" opacity="0.25"/>
    <path d="M0,14 L0,42 A45,14 0 0,0 90,42 L90,14"/>
    <ellipse cx="45" cy="14" rx="45" ry="14"/>
    <path d="M0,42 L0,70 A45,14 0 0,0 90,70 L90,42"/>
    <ellipse cx="45" cy="42" rx="45" ry="14" opacity="0.5"/>
    <path d="M0,70 L0,98 A45,14 0 0,0 90,98 L90,70"/>
    <ellipse cx="45" cy="70" rx="45" ry="14" opacity="0.5"/>
    <ellipse cx="45" cy="98" rx="45" ry="14"/>
  </g>

  <text x="150" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ecf0f1">Database Audit</text>
  <text x="150" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#95a5a6">BUMDes (idesa) &#8226; Structure Review &amp; SQL Optimization</text>

  <!-- Stat 1 -->
  <g transform="translate(40,150)">
    <text x="0" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#e74c3c">66</text>
    <text x="0" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bdc3c7">village data tables</text>
    <text x="0" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bdc3c7">audited</text>
  </g>

  <!-- divider -->
  <line x1="235" y1="155" x2="235" y2="255" stroke="#ffffff" stroke-width="1" opacity="0.15"/>

  <!-- Stat 2 -->
  <g transform="translate(275,150)">
    <text x="0" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#3498db">49</text>
    <text x="0" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bdc3c7">custom SQL queries</text>
    <text x="0" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bdc3c7">optimized</text>
  </g>

  <!-- divider -->
  <line x1="470" y1="155" x2="470" y2="255" stroke="#ffffff" stroke-width="1" opacity="0.15"/>

  <!-- Stat 3 -->
  <g transform="translate(510,150)">
    <text x="0" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#2ecc71">8</text>
    <text x="0" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bdc3c7">tables validated for</text>
    <text x="0" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#bdc3c7">"Village Billing"</text>
  </g>

  <!-- bottom progress-style bar decoration -->
  <g transform="translate(40,290)">
    <rect x="0" y="0" width="560" height="8" rx="4" fill="#ffffff" opacity="0.1"/>
    <rect x="0" y="0" width="560" height="8" rx="4" fill="url(#barGrad)"/>
  </g>

  <text x="40" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7f8c8d">Tools: phpMyAdmin &#8226; DBeaver</text>
  <text x="40" y="355" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7f8c8d">Apr 2025 &#8211; May 2025 &#8226; Freelance</text>
</svg>
